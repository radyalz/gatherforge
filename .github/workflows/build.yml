name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/check-public.sh
      - run: go test ./...
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gatherforge-binaries
          path: dist/*
