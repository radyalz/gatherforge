name: Rust desktop builds
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxkbcommon-dev libwayland-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev
      - run: cargo test
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, label: Linux}
          - {os: windows-latest, label: Windows}
          - {os: macos-15-intel, label: macOS-Intel}
          - {os: macos-latest, label: macOS-AppleSilicon}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxkbcommon-dev libwayland-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev
      - run: cargo build --release
      - run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: GatherForge-${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error
