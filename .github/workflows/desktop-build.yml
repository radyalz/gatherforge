name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: Linux}
          - {os: windows-latest, name: Windows}
          - {os: macos-15-intel, name: macOS-Intel}
          - {os: macos-latest, name: macOS-AppleSilicon}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test ./...
      - run: python -m pip install pyinstaller
      - run: python scripts/build-desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: GatherForge-${{ matrix.name }}
          path: dist/GatherForge*
