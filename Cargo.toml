[package]
name = "gatherforge"
version = "3.10.0"
edition = "2024"
authors = ["GatherForge contributors"]
description = "Native Rust desktop toolkit for downloading and organizing media"
repository = "https://github.com/radyalz/gatherforge"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
lofty = "0.25"
walkdir = "2.5"
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_xlsxwriter = "0.102"
rfd = "0.15"
dirs = "6"
url = "2.5"
ureq = { version = "=2.12.1", default-features = true }
sha2 = "0.10"
sha1 = "0.10"
# Native, in-process CPU Laya inference. No Python/ONNX exporter or server.
laya = "=0.1.1"

[profile.release]
lto = "thin"
strip = true
